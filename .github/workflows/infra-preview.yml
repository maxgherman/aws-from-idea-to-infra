name: PR Preview Infra

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  id-token: write   # for OIDC
  contents: read
  issues: write
  pull-requests: write

jobs:
  private-assets:
    concurrency:
      group: pr-preview-private-assets-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    if: ${{ !github.event.pull_request.head.repo.fork && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' && github.event.pull_request.user.login == vars.AWS_ACTOR && contains(github.event.pull_request.labels.*.name, 'deploy:private-assets') && (github.event.action != 'labeled' || github.event.label.name == 'deploy:private-assets') }}
    environment: aws-preview
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify PR is still open and selected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          PR_STATE=$(jq -r '.state' <<< "$PR_JSON")
          if [[ "$PR_STATE" != "open" ]]; then
            echo "::error::PR ${PR_NUMBER} is ${PR_STATE}; refusing to deploy its preview stack."
            exit 1
          fi
          if ! jq -e --arg deployment_label "deploy:private-assets" '.labels | any(.name == $deployment_label)' <<< "$PR_JSON" > /dev/null; then
            echo "::error::PR ${PR_NUMBER} no longer has deploy:private-assets; refusing to deploy."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        run: npm ci

      - name: Test
        run: npm test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: pr-${{ github.event.pull_request.number }}
          audience: sts.amazonaws.com

      - name: Resolve CDK env
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "CDK_DEFAULT_ACCOUNT=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "CDK_DEFAULT_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV

      - name: Deploy preview stack
        env:
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          aws cloudformation describe-stacks \
            --stack-name AssetSeriesAuth \
            --query 'Stacks[0].StackStatus' \
            --output text

          NOTIFICATION_ARGS=()
          if [[ -n "$NOTIFICATION_EMAIL" ]]; then
            NOTIFICATION_ARGS=(-c "notificationEmail=$NOTIFICATION_EMAIL")
          fi

          npx cdk deploy --all \
            -c pr=${PR_NUMBER} \
            -c acct=${ACCOUNT_ID} \
            -c reg=${{ vars.AWS_REGION }} \
            -c repo=${GITHUB_REPOSITORY} \
            -c sha=${GITHUB_SHA} \
            -c run=${GITHUB_RUN_ID} \
            "${NOTIFICATION_ARGS[@]}" \
            --app "npx ts-node bin/preview.ts" \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Generate config.js for the preview page
        run: |
          STACK="Stack-PR${PR_NUMBER}"
          API_BASE_URL=$(jq -r --arg stack "$STACK" '.[$stack].AssetApiBaseUrl' cdk-outputs.json)
          USER_POOL_ID=$(jq -r --arg stack "$STACK" '.[$stack].UserPoolId' cdk-outputs.json)
          USER_POOL_CLIENT_ID=$(jq -r --arg stack "$STACK" '.[$stack].UserPoolClientId' cdk-outputs.json)
          USER_POOL_ISSUER=$(jq -r --arg stack "$STACK" '.[$stack].UserPoolIssuer' cdk-outputs.json)
          USER_POOL_HOSTED_UI_URL=$(jq -r --arg stack "$STACK" '.[$stack].UserPoolHostedUiUrl' cdk-outputs.json)
          BUCKET_NAME=$(jq -r --arg stack "$STACK" '.[$stack].BucketName' cdk-outputs.json)
          DISTRIBUTION_ID=$(jq -r --arg stack "$STACK" '.[$stack].DistributionId' cdk-outputs.json)
          ASSET_WORKFLOW_ARN=$(jq -r --arg stack "$STACK" '.[$stack].AssetWorkflowArn' cdk-outputs.json)
          ASSET_LIFECYCLE_EVENT_BUS_NAME=$(jq -r --arg stack "$STACK" '.[$stack].AssetLifecycleEventBusName' cdk-outputs.json)
          ASSET_LIFECYCLE_LOG_GROUP_NAME=$(jq -r --arg stack "$STACK" '.[$stack].AssetLifecycleLogGroupName' cdk-outputs.json)

          for value in "$API_BASE_URL" "$USER_POOL_ID" "$USER_POOL_CLIENT_ID" "$USER_POOL_ISSUER" "$USER_POOL_HOSTED_UI_URL" "$BUCKET_NAME" "$DISTRIBUTION_ID" "$ASSET_WORKFLOW_ARN" "$ASSET_LIFECYCLE_EVENT_BUS_NAME" "$ASSET_LIFECYCLE_LOG_GROUP_NAME"; do
            test -n "$value" && test "$value" != "null"
          done

          cat > site/config.js <<EOF
          window.__PREVIEW_CONFIG__ = {
            apiBaseUrl: '${API_BASE_URL%/}',
            userPoolId: '${USER_POOL_ID}',
            userPoolClientId: '${USER_POOL_CLIENT_ID}',
            userPoolIssuer: '${USER_POOL_ISSUER}',
            userPoolHostedUiUrl: '${USER_POOL_HOSTED_UI_URL}'
          };
          EOF

          aws s3 cp site/config.js "s3://${BUCKET_NAME}/config.js" --content-type application/javascript
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths /config.js

      - name: Comment preview URLs
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ secrets.PR_COMMENT_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-preview-urls -->';
            const stackName = `Stack-PR${process.env.PR_NUMBER}`;
            const outputs = JSON.parse(fs.readFileSync('cdk-outputs.json', 'utf8'));
            const previewUrl = outputs?.[stackName]?.PreviewUrl;
            const apiUrl = outputs?.[stackName]?.ApiUrl;
            const assetApiBaseUrl = outputs?.[stackName]?.AssetApiBaseUrl;
            const workflowArn = outputs?.[stackName]?.AssetWorkflowArn;
            const eventBusName = outputs?.[stackName]?.AssetLifecycleEventBusName;
            const lifecycleLogGroupName = outputs?.[stackName]?.AssetLifecycleLogGroupName;
            if (!previewUrl) {
              throw new Error(`Missing PreviewUrl output for stack "${stackName}"`);
            }
            if (!apiUrl) {
              throw new Error(`Missing ApiUrl output for stack "${stackName}"`);
            }
            if (!assetApiBaseUrl) {
              throw new Error(`Missing AssetApiBaseUrl output for stack "${stackName}"`);
            }
            if (!workflowArn) {
              throw new Error(`Missing AssetWorkflowArn output for stack "${stackName}"`);
            }
            if (!eventBusName) {
              throw new Error(`Missing AssetLifecycleEventBusName output for stack "${stackName}"`);
            }
            if (!lifecycleLogGroupName) {
              throw new Error(`Missing AssetLifecycleLogGroupName output for stack "${stackName}"`);
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const body = `${marker}\nPreview: ${previewUrl}\nAPI: ${apiUrl}\nAssets: ${assetApiBaseUrl}\nWorkflow: ${workflowArn}\nEvent bus: ${eventBusName}\nLifecycle log: ${lifecycleLogGroupName}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  booking:
    concurrency:
      group: pr-preview-booking-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    if: ${{ !github.event.pull_request.head.repo.fork && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' && github.event.pull_request.user.login == vars.AWS_ACTOR && contains(github.event.pull_request.labels.*.name, 'deploy:booking') && (github.event.action != 'labeled' || github.event.label.name == 'deploy:booking') }}
    environment: aws-preview
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify PR is still open and selected
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          PR_STATE=$(jq -r '.state' <<< "$PR_JSON")
          if [[ "$PR_STATE" != "open" ]]; then
            echo "::error::PR ${PR_NUMBER} is ${PR_STATE}; refusing to deploy its preview stack."
            exit 1
          fi
          if ! jq -e --arg deployment_label "deploy:booking" '.labels | any(.name == $deployment_label)' <<< "$PR_JSON" > /dev/null; then
            echo "::error::PR ${PR_NUMBER} no longer has deploy:booking; refusing to deploy."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: pr-${{ github.event.pull_request.number }}-ecr
          audience: sts.amazonaws.com

      - name: Resolve CDK env
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "CDK_DEFAULT_ACCOUNT=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "CDK_DEFAULT_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV

      - name: Deploy ECR stack
        run: |
          npx cdk deploy \
            -c pr=${PR_NUMBER} \
            -c acct=${ACCOUNT_ID} \
            -c reg=${{ vars.AWS_REGION }} \
            -c repo=${GITHUB_REPOSITORY} \
            -c sha=${GITHUB_SHA} \
            -c run=${GITHUB_RUN_ID} \
            --app "npx ts-node bin/booking-ecr.ts" \
            --require-approval never \
            --outputs-file ecr-outputs.json

      - name: Read ECR repository URI
        run: |
          ECR_STACK="BookingEcr-PR${PR_NUMBER}"
          REPO_URI=$(jq -r --arg stack "$ECR_STACK" '.[$stack].RepositoryUri' ecr-outputs.json)
          test -n "$REPO_URI" && test "$REPO_URI" != "null"
          echo "REPO_URI=$REPO_URI" >> $GITHUB_ENV

      - name: Authenticate with ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push booking image
        run: |
          docker build -t "$REPO_URI:$GITHUB_SHA" ./booking
          docker push "$REPO_URI:$GITHUB_SHA"

      - name: Comment booking ECR URI
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_URI: ${{ env.REPO_URI }}
        with:
          github-token: ${{ secrets.PR_COMMENT_TOKEN || github.token }}
          script: |
            const marker = '<!-- pr-booking-preview -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const body = `${marker}\nBooking ECR: ${process.env.REPO_URI}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
