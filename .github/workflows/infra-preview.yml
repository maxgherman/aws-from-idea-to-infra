name: PR Preview Infra

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  id-token: write   # for OIDC
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    if: ${{ !github.event.pull_request.head.repo.fork && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' && github.event.pull_request.user.login == vars.AWS_ACTOR }}
    environment: aws-preview
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install deps
        run: npm ci

      - name: Test
        run: npm test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: pr-${{ github.event.pull_request.number }}
          audience: sts.amazonaws.com

      - name: Resolve CDK env
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "CDK_DEFAULT_ACCOUNT=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "CDK_DEFAULT_REGION=${{ vars.AWS_REGION }}" >> $GITHUB_ENV

      - name: Deploy preview stack
        run: |
          aws cloudformation describe-stacks \
            --stack-name AssetSeriesAuth \
            --query 'Stacks[0].StackStatus' \
            --output text

          npx cdk deploy \
            -c pr=${PR_NUMBER} \
            -c acct=${ACCOUNT_ID} \
            -c reg=${{ vars.AWS_REGION }} \
            -c repo=${GITHUB_REPOSITORY} \
            -c sha=${GITHUB_SHA} \
            -c run=${GITHUB_RUN_ID} \
            --app "npx ts-node bin/preview.ts" \
            --require-approval never \
            --outputs-file cdk-outputs.json

      - name: Generate config.js for the preview page
        run: |
          STACK="Stack-PR${PR_NUMBER}"
          API_BASE_URL=$(jq -r --arg stack "$STACK" '.[$stack].AssetApiBaseUrl' cdk-outputs.json)
          USER_POOL_ID=$(jq -r --arg stack "$STACK" '.[$stack].UserPoolId' cdk-outputs.json)
          USER_POOL_CLIENT_ID=$(jq -r --arg stack "$STACK" '.[$stack].UserPoolClientId' cdk-outputs.json)
          USER_POOL_ISSUER=$(jq -r --arg stack "$STACK" '.[$stack].UserPoolIssuer' cdk-outputs.json)
          USER_POOL_HOSTED_UI_URL=$(jq -r --arg stack "$STACK" '.[$stack].UserPoolHostedUiUrl' cdk-outputs.json)
          BUCKET_NAME=$(jq -r --arg stack "$STACK" '.[$stack].BucketName' cdk-outputs.json)
          DISTRIBUTION_ID=$(jq -r --arg stack "$STACK" '.[$stack].DistributionId' cdk-outputs.json)
          ASSET_WORKFLOW_ARN=$(jq -r --arg stack "$STACK" '.[$stack].AssetWorkflowArn' cdk-outputs.json)
          ASSET_LIFECYCLE_EVENT_BUS_NAME=$(jq -r --arg stack "$STACK" '.[$stack].AssetLifecycleEventBusName' cdk-outputs.json)
          ASSET_LIFECYCLE_LOG_GROUP_NAME=$(jq -r --arg stack "$STACK" '.[$stack].AssetLifecycleLogGroupName' cdk-outputs.json)

          for value in "$API_BASE_URL" "$USER_POOL_ID" "$USER_POOL_CLIENT_ID" "$USER_POOL_ISSUER" "$USER_POOL_HOSTED_UI_URL" "$BUCKET_NAME" "$DISTRIBUTION_ID" "$ASSET_WORKFLOW_ARN" "$ASSET_LIFECYCLE_EVENT_BUS_NAME" "$ASSET_LIFECYCLE_LOG_GROUP_NAME"; do
            test -n "$value" && test "$value" != "null"
          done

          cat > site/config.js <<EOF
          window.__PREVIEW_CONFIG__ = {
            apiBaseUrl: '${API_BASE_URL%/}',
            userPoolId: '${USER_POOL_ID}',
            userPoolClientId: '${USER_POOL_CLIENT_ID}',
            userPoolIssuer: '${USER_POOL_ISSUER}',
            userPoolHostedUiUrl: '${USER_POOL_HOSTED_UI_URL}'
          };
          EOF

          aws s3 cp site/config.js "s3://${BUCKET_NAME}/config.js" --content-type application/javascript
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths /config.js

      - name: Comment preview URLs
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          github-token: ${{ secrets.PR_COMMENT_TOKEN || github.token }}
          script: |
            const fs = require('fs');
            const marker = '<!-- pr-preview-urls -->';
            const stackName = `Stack-PR${process.env.PR_NUMBER}`;
            const outputs = JSON.parse(fs.readFileSync('cdk-outputs.json', 'utf8'));
            const previewUrl = outputs?.[stackName]?.PreviewUrl;
            const apiUrl = outputs?.[stackName]?.ApiUrl;
            const assetApiBaseUrl = outputs?.[stackName]?.AssetApiBaseUrl;
            const workflowArn = outputs?.[stackName]?.AssetWorkflowArn;
            const eventBusName = outputs?.[stackName]?.AssetLifecycleEventBusName;
            const lifecycleLogGroupName = outputs?.[stackName]?.AssetLifecycleLogGroupName;
            if (!previewUrl) {
              throw new Error(`Missing PreviewUrl output for stack "${stackName}"`);
            }
            if (!apiUrl) {
              throw new Error(`Missing ApiUrl output for stack "${stackName}"`);
            }
            if (!assetApiBaseUrl) {
              throw new Error(`Missing AssetApiBaseUrl output for stack "${stackName}"`);
            }
            if (!workflowArn) {
              throw new Error(`Missing AssetWorkflowArn output for stack "${stackName}"`);
            }
            if (!eventBusName) {
              throw new Error(`Missing AssetLifecycleEventBusName output for stack "${stackName}"`);
            }
            if (!lifecycleLogGroupName) {
              throw new Error(`Missing AssetLifecycleLogGroupName output for stack "${stackName}"`);
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;

            const body = `${marker}\nPreview: ${previewUrl}\nAPI: ${apiUrl}\nAssets: ${assetApiBaseUrl}\nWorkflow: ${workflowArn}\nEvent bus: ${eventBusName}\nLifecycle log: ${lifecycleLogGroupName}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && typeof c.body === 'string' && c.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
